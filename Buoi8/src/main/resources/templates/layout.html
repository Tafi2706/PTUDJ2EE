<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - B8 Premium Store' : 'B8 Premium Store'}">B8 Premium Store</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg glass-nav mb-4 shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="/products">
            <div class="logo-box me-2" style="width: 32px; height: 32px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 8px;"></div>
            <span>Kobe STORE</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link text-white-50 px-3" href="/products">SẢN PHẨM</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link text-warning fw-bold px-3 d-flex align-items-center" href="/admin/products">
                        <i class="fas fa-shield-halved me-2"></i>QUẢN TRỊ
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav align-items-center">
                <li class="nav-item me-4 position-relative">
                    <a class="nav-link text-white-50" href="/cart">
                        <i class="fas fa-shopping-bag fs-5"></i>
                        <span class="badge position-absolute top-0 start-100 translate-middle bg-primary rounded-pill border border-2 border-dark" 
                              th:text="${session.cart != null ? session.cart.size() : 0}"
                              style="font-size: 0.65rem;">0</span>
                    </a>
                </li>
                
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle d-flex align-items-center text-white gap-2 p-0" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        <div class="user-avatar" style="width: 36px; height: 36px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--surface-border);">
                            <i class="fas fa-user-astronaut"></i>
                        </div>
                        <span class="fw-semibold" sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end glass-form border-0 shadow-lg mt-3" style="min-width: 200px; padding: 10px;">
                        <li><a class="dropdown-item text-white py-2 rounded-3 hover-glass" href="#"><i class="fas fa-id-card me-2 opacity-50"></i>Hồ sơ</a></li>
                        <li><hr class="dropdown-divider opacity-10"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item text-danger py-2 rounded-3 hover-glass">
                                    <i class="fas fa-power-off me-2 opacity-50"></i>Đăng xuất
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
                
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light border-0 px-4 me-2" href="/login">LOGIN</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-premium px-4" href="/register">SIGN UP</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container main-content animate-fade-in" th:insert="${content}">
    <!-- Nội dung thay đổi -->
</div>

<footer class="mt-5 py-5 border-top border-secondary opacity-25">
    <div class="container text-center">
        <p class="mb-0 text-white-50">© 2026 B8 PREMIUM STORE. DESIGNED WITH PRECISION.</p>
    </div>
</footer>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
