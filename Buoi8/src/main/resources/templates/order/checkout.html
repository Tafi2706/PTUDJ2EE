<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán - B8 Premium Store</title>
</head>
<body>
<div th:replace="~{layout :: html(content=~{::div.container})}">
    <div class="container py-5 animate-fade-in" style="max-width: 1200px;">
        
        <div class="mb-5 d-flex align-items-center justify-content-between">
            <h2 class="fw-800 mb-0 tracking-tighter" style="font-size: 2rem;">SECURE <span class="text-primary">CHECKOUT</span></h2>
            <div class="d-flex align-items-center gap-3 op-50">
                <span class="small fw-bold">ENCRYPTED CONNECTION</span>
                <i class="fas fa-lock text-success"></i>
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger px-4 py-3 border-0 text-danger rounded-4 mb-4" style="background: rgba(244,63,94,0.1);">
            <i class="fas fa-times-circle me-2"></i><span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/checkout}" method="post" id="checkoutForm">
            <div class="row g-5">
                <div class="col-lg-7">
                    <!-- Delivery Info -->
                    <div class="glass-form p-4 p-md-5 rounded-5 border-0 shadow-lg mb-4">
                        <div class="d-flex align-items-center mb-5">
                            <div class="rounded-circle bg-primary bg-opacity-25 p-3 me-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                <i class="fas fa-truck-fast text-primary"></i>
                            </div>
                            <h4 class="fw-bold mb-0">Delivery Details</h4>
                        </div>
                        
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold tracking-widest text-uppercase mb-2">FULL NAME</label>
                                <input type="text" name="name" class="form-control py-3" th:value="${name}" required placeholder="Recipient name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-white-50 small fw-bold tracking-widest text-uppercase mb-2">PHONE NUMBER</label>
                                <input type="text" name="phone" class="form-control py-3" th:value="${phone}" required placeholder="+84 000 000 000">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-white-50 small fw-bold tracking-widest text-uppercase mb-2">SHIPPING ADDRESS</label>
                                <textarea name="address" class="form-control py-3" rows="3" required th:text="${address}" placeholder="Street name, City, Region"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Choice -->
                    <div class="glass-form p-4 rounded-5 border-0 shadow-lg">
                        <div class="d-flex align-items-center mb-4">
                            <div class="rounded-circle bg-secondary bg-opacity-25 p-3 me-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                                <i class="fas fa-credit-card text-secondary"></i>
                            </div>
                            <h4 class="fw-bold mb-0">Payment Option</h4>
                        </div>
                        
                        <div class="rounded-4 p-4 d-flex align-items-center gap-3 border border-primary border-opacity-50" style="background: rgba(99,102,241,0.05);">
                            <input class="form-check-input bg-transparent border-primary border-2 m-0" type="radio" name="payment" id="cod" value="COD" checked style="width: 20px; height: 20px; cursor: pointer;">
                            <label class="form-check-label flex-grow-1 fw-bold fs-6" for="cod" style="cursor: pointer;">
                                CASH ON DELIVERY (COD)
                                <span class="d-block small text-white-50 fw-normal">Pay with cash when package is delivered.</span>
                            </label>
                            <i class="fas fa-hand-holding-dollar fs-3 text-white-50"></i>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="glass-form p-4 rounded-5 border-0 shadow-2xl position-sticky" style="top: 100px;">
                        <h4 class="fw-bold mb-4">ORDER REVIEW</h4>
                        
                        <div class="scroll-y mb-4 pe-2" style="max-height: 380px; overflow-y: auto;">
                            <!-- Items -->
                            <div th:each="item : ${cartItems}" class="d-flex align-items-center justify-content-between mb-4 animate-fade-in">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="rounded-3 overflow-hidden border border-white-10" style="width: 60px; height: 60px;">
                                        <img th:src="${item.image != null && item.image != '' ? item.image : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=800&auto=format&fit=crop'}" 
                                             class="w-100 h-100" style="object-fit: cover;">
                                    </div>
                                    <div style="max-width: 180px;">
                                        <h6 class="fw-bold mb-1 small text-truncate" th:text="${item.productName}">Product Name</h6>
                                        <span class="text-white-50 small fw-semibold" th:text="'QTY: ' + ${item.quantity}"></span>
                                    </div>
                                </div>
                                <span class="fw-800 small" th:text="${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                            </div>
                        </div>

                        <div class="pt-4 border-top border-white border-opacity-10">
                            <div class="d-flex justify-content-between mb-2 text-white-50 small">
                                <span class="fw-bold">DELIVERY TAX</span>
                                <span class="text-success fw-bold">FREE</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-end mb-5">
                                <span class="fw-900 fs-5">TOTAL PAYABLE</span>
                                <h3 class="fw-900 text-primary mb-0" th:text="${#numbers.formatDecimal(totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></h3>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-premium w-100 py-3 rounded-pill fs-5 d-flex align-items-center justify-content-center gap-3">
                            PLACE ORDER NOW <i class="fas fa-shield-check"></i>
                        </button>
                        
                        <div class="mt-4 text-center">
                            <p class="small text-white-25 mb-0"><i class="fas fa-shield-halved me-2"></i> Guaranteed Safe & Secure Checkout</p>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<style>
    .scroll-y::-webkit-scrollbar { width: 4px; }
    .scroll-y::-webkit-scrollbar-thumb { background: var(--surface-border); border-radius: 4px; }
    .border-white-10 { border: 1px solid rgba(255,255,255,0.1); }
</style>
</body>
</html>
