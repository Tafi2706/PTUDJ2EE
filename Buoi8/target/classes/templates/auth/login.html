<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Kobe STORE</title>
</head>

<body>
    <div th:replace="~{layout :: html(content=~{::div.card-container})}">
        <div class="card-container d-flex justify-content-center align-items-center py-5">
            <div class="glass-form shadow-2xl" style="max-width: 480px; width: 100%;">
                <div class="text-center mb-5">
                    <div class="d-inline-flex p-3 rounded-circle mb-3 mb-1"
                        style="background: var(--primary-glow); border: 2px solid var(--primary);">
                        <i class="fas fa-lock-open fa-2x"></i>
                    </div>
                    <h2 class="fw-bold mb-1">WELCOME BACK</h2>
                    <p class="text-white-50">Please enter your details to sign in.</p>
                </div>

                <form th:action="@{/login}" method="post">
                    <div th:if="${param.error}"
                        class="alert alert-danger px-4 py-3 bg-opacity-10 border-0 text-danger rounded-3"
                        style="background: rgba(244,63,94,0.1);">
                        <i class="fas fa-exclamation-circle me-2"></i>Tên đăng nhập hoặc mật khẩu không đúng.
                    </div>
                    <div th:if="${successMessage}"
                        class="alert alert-success px-4 py-3 border-0 text-success rounded-3 mb-4"
                        style="background: rgba(16,185,129,0.1);" th:text="${successMessage}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 small fw-semibold">USERNAME</label>
                        <input type="text" name="username" class="form-control" placeholder="admin / user" required
                            autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-white-50 small fw-semibold">PASSWORD</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input bg-transparent border-white-50" type="checkbox"
                                id="rememberMe">
                            <label class="form-check-label text-white-50 small" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#"
                            class="text-primary small text-decoration-none fw-semibold border-bottom border-primary border-opacity-25">Forgot
                            password?</a>
                    </div>

                    <button type="submit" class="btn btn-premium w-100 py-3 mb-4 fs-5">SIGN IN NOW</button>
                </form>

                <div class="text-center">
                    <p class="text-white-50 mb-0 small">Don't have an account? <a href="/register"
                            class="text-white fw-bold text-decoration-none ms-2">Create Account</a></p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
