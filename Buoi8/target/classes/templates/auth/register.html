<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Kobe STORE</title>
</head>

<body>
    <div th:replace="~{layout :: html(content=~{::div.card-container})}">
        <div class="card-container d-flex justify-content-center align-items-center py-5">
            <div class="glass-form shadow-2xl" style="max-width: 520px; width: 100%;">
                <div class="text-center mb-5">
                    <div class="d-inline-flex p-3 rounded-circle mb-3"
                        style="background: rgba(168,85,247,0.1); border: 2px solid var(--secondary);">
                        <i class="fas fa-user-plus fa-2x text-secondary"></i>
                    </div>
                    <h2 class="fw-bold mb-1">CREATE ACCOUNT</h2>
                    <p class="text-white-50">Join our community of premium tech enthusiasts.</p>
                </div>

                <form th:action="@{/register}" method="post">
                    <div th:if="${errorMessage}"
                        class="alert alert-danger px-4 py-3 bg-opacity-10 border-0 text-danger rounded-3 mb-4"
                        style="background: rgba(244,63,94,0.1);">
                        <i class="fas fa-times-circle me-2"></i><span th:text="${errorMessage}"></span>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-white-50 small fw-semibold">USERNAME</label>
                            <input type="text" name="username" class="form-control" placeholder="Choose unique name"
                                required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-white-50 small fw-semibold">PASSWORD</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-white-50 small fw-semibold">FULL NAME</label>
                        <input type="text" name="fullName" class="form-control" placeholder="Enter your full name">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-white-50 small fw-semibold">EMAIL ADDRESS</label>
                        <input type="email" name="email" class="form-control" placeholder="example@mail.com">
                    </div>

                    <button type="submit" class="btn btn-premium w-100 py-3 mb-4 fs-5"
                        style="background: linear-gradient(135deg, var(--secondary), var(--accent));">SIGN UP
                        NOW</button>
                </form>

                <div class="text-center">
                    <p class="text-white-50 mb-0 small">Already have an account? <a href="/login"
                            class="text-white fw-bold text-decoration-none ms-2">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
