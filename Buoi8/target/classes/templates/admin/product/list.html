<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Kobe STORE</title>
</head>

<body>
    <div th:replace="~{layout :: html(content=~{::div.container-fluid})}">
        <div class="container-fluid py-4 px-lg-5 animate-fade-in">

            <div class="d-flex justify-content-between align-items-center mb-5">
                <div>
                    <h2 class="fw-800 text-uppercase tracking-tighter" style="font-size: 2rem;">PRODUCT <span
                            class="text-warning">MANAGEMENT</span></h2>
                    <p class="text-white-50 small mb-0"><i class="fas fa-hammer me-2 text-warning"></i>Administrate your
                        digital store inventory</p>
                </div>
                <a th:href="@{/admin/products/create}"
                    class="btn btn-premium px-4 rounded-pill d-flex align-items-center gap-2"
                    style="background: linear-gradient(135deg, var(--secondary), var(--accent));">
                    <i class="fas fa-plus"></i> ADD NEW PRODUCT
                </a>
            </div>

            <div th:if="${successMessage}"
                class="alert alert-success alert-dismissible animate-fade-in border-0 rounded-4 px-4 py-3 mb-4 d-flex align-items-center shadow-lg"
                style="background: rgba(16,185,129,0.1); color: #10b981;">
                <i class="fas fa-check-double me-3 fs-4"></i>
                <span class="fw-semibold" th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" style="filter: invert(1);"></button>
            </div>

            <div th:if="${errorMessage}"
                class="alert alert-danger alert-dismissible animate-fade-in border-0 rounded-4 px-4 py-3 mb-4 d-flex align-items-center shadow-lg"
                style="background: rgba(244,63,94,0.1);">
                <i class="fas fa-circle-exclamation me-3 fs-4 text-danger"></i>
                <span class="fw-semibold text-danger" th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" style="filter: invert(1);"></button>
            </div>

            <!-- Dashboard Filter -->
            <div class="glass-form p-4 border-0 shadow-lg rounded-5 mb-5">
                <form th:action="@{/admin/products}" method="get" class="row g-3 align-items-center">
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text bg-transparent border-0 text-white-50"><i
                                    class="fas fa-search"></i></span>
                            <input type="text" name="keyword" class="form-control border-0 shadow-none ps-0"
                                placeholder="Filter by name..." th:value="${keyword}">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select name="categoryId" class="form-select bg-transparent border-0 shadow-none text-white-50"
                            style="cursor: pointer;">
                            <option value="" class="bg-dark">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                th:selected="${cat.id == categoryId}" class="bg-dark"></option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select name="sortDir" class="form-select bg-transparent border-0 shadow-none text-white-50"
                            style="cursor: pointer;">
                            <option value="desc" th:selected="${sortDir == 'desc'}" class="bg-dark">Latest Updates
                            </option>
                            <option value="asc" th:selected="${sortDir == 'asc'}" class="bg-dark">Price: Ascending
                            </option>
                        </select>
                    </div>
                    <div class="col-md-2 d-grid">
                        <button type="submit"
                            class="btn btn-outline-light rounded-pill border-opacity-25 py-2">FILTER</button>
                    </div>
                </form>
            </div>

            <!-- Inventory Table -->
            <div class="glass-form p-0 border-0 shadow-2xl rounded-5 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 text-white border-0">
                        <thead style="background: rgba(255,255,255,0.03);">
                            <tr>
                                <th
                                    class="ps-4 py-4 border-0 text-white-50 small fw-bold tracking-widest text-uppercase text-center">
                                    ID</th>
                                <th class="py-4 border-0 text-white-50 small fw-bold tracking-widest text-uppercase">
                                    TECH PRODUCT</th>
                                <th
                                    class="py-4 border-0 text-white-50 small fw-bold tracking-widest text-uppercase text-center">
                                    CATEGORY</th>
                                <th
                                    class="py-4 border-0 text-white-50 small fw-bold tracking-widest text-uppercase text-end">
                                    UNIT PRICE</th>
                                <th
                                    class="pe-4 py-4 border-0 text-white-50 small fw-bold tracking-widest text-uppercase text-center">
                                    ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}" class="border-0" style="transition: var(--transition);">
                                <td class="text-center py-4 border-0 border-bottom border-white border-opacity-10 fw-800 text-white-25"
                                    th:text="${product.id}">1</td>
                                <td class="py-4 border-0 border-bottom border-white border-opacity-10">
                                    <div class="d-flex align-items-center">
                                        <div class="rounded-3 overflow-hidden me-3"
                                            style="width: 50px; height: 50px; border: 1px solid var(--surface-border);">
                                            <img th:src="${product.image != null && product.image != '' ? product.image : 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=800&auto=format&fit=crop'}"
                                                class="w-100 h-100" style="object-fit: cover;">
                                        </div>
                                        <div style="max-width: 300px;">
                                            <h6 class="fw-bold mb-0 text-truncate" th:text="${product.name}">Product
                                                Name</h6>
                                            <small class="text-white-25"
                                                th:text="${#strings.abbreviate(product.description, 40)}"></small>
                                        </div>
                                    </div>
                                </td>
                                <td class="text-center py-4 border-0 border-bottom border-white border-opacity-10">
                                    <span class="badge-category" th:text="${product.category.name}">Category</span>
                                </td>
                                <td class="text-end py-4 border-0 border-bottom border-white border-opacity-10">
                                    <span class="fw-bold text-warning"
                                        th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                                </td>
                                <td class="pe-4 py-4 border-0 border-bottom border-white border-opacity-10 text-center">
                                    <div class="d-flex justify-content-center gap-2">
                                        <a th:href="@{/admin/products/edit/{id}(id=${product.id})}"
                                            class="btn btn-sm btn-outline-primary rounded-3 border-opacity-25"
                                            style="width: 36px; height: 36px;"><i class="fas fa-edit"></i></a>
                                        <a th:href="@{/admin/products/delete/{id}(id=${product.id})}"
                                            class="btn btn-sm btn-outline-danger rounded-3 border-opacity-25"
                                            style="width: 36px; height: 36px;"
                                            onclick="return confirm('Destroy this entity from inventory? This action is irreversible.')"><i
                                                class="fas fa-trash-alt"></i></a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Admin Pagination -->
            <nav th:if="${totalPages > 1}" class="mt-5 animate-fade-in" aria-label="Page navigation">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link py-2 px-3"
                            th:href="@{/admin/products(page=${currentPage - 1}, keyword=${keyword}, categoryId=${categoryId}, sortDir=${sortDir})}">
                            <i class="fas fa-arrow-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                        th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link py-2 px-4 shadow-sm"
                            th:href="@{/admin/products(page=${i}, keyword=${keyword}, categoryId=${categoryId}, sortDir=${sortDir})}"
                            th:text="${i}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link py-2 px-3"
                            th:href="@{/admin/products(page=${currentPage + 1}, keyword=${keyword}, categoryId=${categoryId}, sortDir=${sortDir})}">
                            <i class="fas fa-arrow-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </div>
</body>

</html>
