<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Product Form - B8 Admin</title>
</head>
<body>
<div th:replace="~{layout :: html(content=~{::div.container})}">
    <div class="container py-5 animate-fade-in" style="max-width: 900px;">
        
        <div class="glass-form p-0 border-0 shadow-2xl rounded-5 overflow-hidden">
            <div class="p-5 d-flex align-items-center justify-content-between" style="background: rgba(255,255,255,0.02); border-bottom: 1px solid var(--surface-border);">
                <div>
                    <h3 class="fw-800 mb-1" th:text="${pageTitle}">EDIT PRODUCT</h3>
                    <p class="text-white-50 small mb-0">Modify product properties and metadata.</p>
                </div>
                <a th:href="@{/admin/products}" class="btn btn-outline-light rounded-circle p-0 d-flex align-items-center justify-content-center border-opacity-25" style="width: 40px; height: 40px;">
                    <i class="fas fa-times"></i>
                </a>
            </div>

            <div class="p-5">
                <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="row g-4 mb-5">
                        <div class="col-12">
                            <label class="form-label text-white-50 small fw-bold tracking-widest text-uppercase mb-2">PRODUCT NAME (*)</label>
                            <input type="text" th:field="*{name}" class="form-control py-3 rounded-4" required placeholder="Ex: Sony WH-1000XM5">
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label text-white-50 small fw-bold tracking-widest text-uppercase mb-2">UNIT PRICE (*)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-white-10 text-white-25 fw-bold">VNĐ</span>
                                <input type="number" th:field="*{price}" class="form-control py-3 border-start-0 rounded-end-4" required min="0" step="1000">
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label text-white-50 small fw-bold tracking-widest text-uppercase mb-2">CATEGORY (*)</label>
                            <select th:field="*{category.id}" class="form-select py-3 rounded-4 bg-dark bg-opacity-25 border-white-10 text-white" required>
                                <option value="" class="bg-dark">Select Category</option>
                                <option th:each="cat : ${categories}" 
                                        th:value="${cat.id}" 
                                        th:text="${cat.name}"
                                        class="bg-dark"></option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-white-50 small fw-bold tracking-widest text-uppercase mb-2">IMAGE URL (EXTERNAL LINK)</label>
                            <input type="text" th:field="*{image}" class="form-control py-3 rounded-4" placeholder="https://source.unsplash.com/...">
                            <div class="mt-3 p-3 rounded-4 d-flex align-items-center gap-3 border border-white border-opacity-10 bg-white bg-opacity-5">
                                <i class="fas fa-image text-white-25 fs-4"></i>
                                <span class="small text-white-50">Providing an external high-res image URL is recommended for premium presentation.</span>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-white-50 small fw-bold tracking-widest text-uppercase mb-2">FULL DESCRIPTION</label>
                            <textarea th:field="*{description}" class="form-control rounded-4" rows="5" placeholder="Highlight key features, technical specs, and shipping details..."></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3 pt-4 border-top border-white border-opacity-10">
                        <a th:href="@{/admin/products}" class="btn btn-outline-light px-5 py-3 rounded-pill border-opacity-25 small fw-bold">DISCARD CHANGES</a>
                        <button type="submit" class="btn btn-premium px-5 py-3 rounded-pill fs-6 fw-bold shadow-lg">
                            <i class="fas fa-floppy-disk me-2"></i>COMMIT METADATA
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
    </div>
</div>

<style>
    .border-white-10 { border: 1px solid rgba(255,255,255,0.1) !important; }
</style>
</body>
</html>
